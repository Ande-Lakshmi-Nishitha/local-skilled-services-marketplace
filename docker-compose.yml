# Local databases for development: PostgreSQL 16 with pgvector, and MongoDB 7.
#   docker compose up -d --wait     (or: npm run db:up)
#   docker compose down             stop (data is kept in the named volumes)
#   docker compose down -v          stop AND delete all data
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skillmarket-postgres
    environment:
      POSTGRES_USER: skillmarket
      POSTGRES_PASSWORD: skillmarket
      POSTGRES_DB: skillmarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillmarket -d skillmarket"]
      interval: 3s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:7
    container_name: skillmarket-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  mongodata:
